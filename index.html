<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Mapa Interactivo de Fuerteventura 4x4 y Servicios</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Leaflet CSS & JS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        html, body { height: 100%; margin: 0; padding: 0; }
        #map { height: 100%; width: 100%; z-index: 1; }
        .custom-popup .leaflet-popup-content-wrapper {
            border-radius: 12px;
            padding: 8px;
            background-color: #1f2937;
            color: #f3f4f6;
            box-shadow: 0 12px 28px -5px rgba(0,0,0,0.8);
            border: 1px solid #374151;
        }
        .custom-popup .leaflet-popup-tip {
            background-color: #1f2937;
        }
        .custom-scrollbar::-webkit-scrollbar {
            width: 5px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: #111827;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: #4b5563;
            border-radius: 3px;
        }
        .marker-pin-svg {
            display: flex;
            align-items: center;
            justify-content: center;
            filter: drop-shadow(0px 4px 8px rgba(0,0,0,0.7));
            transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        .marker-pin-svg:hover {
            transform: scale(1.25);
            z-index: 9999 !important;
        }
        .pulse-effect {
            animation: pulse-ring 2s infinite;
        }
        @keyframes pulse-ring {
            0% { transform: scale(0.95); opacity: 0.9; }
            50% { transform: scale(1.1); opacity: 0.4; }
            100% { transform: scale(0.95); opacity: 0.9; }
        }
    </style>
</head>
<body class="bg-gray-900 text-gray-100 flex flex-col h-screen font-sans antialiased overflow-hidden">

    <!-- Header Navigation -->
    <header class="bg-gray-800/95 backdrop-blur border-b border-gray-700 px-3 py-2 flex items-center justify-between shadow-xl z-30 shrink-0">
        <div class="flex items-center space-x-2.5">
            <button id="toggle-sidebar-btn" onclick="toggleSidebar()" class="p-1.5 bg-gray-700 hover:bg-gray-600 text-amber-400 rounded-lg focus:outline-none transition">
                <i class="fa-solid fa-layer-group text-base"></i>
            </button>
            <div class="p-1.5 bg-amber-500/20 text-amber-400 rounded-lg">
                <i class="fa-solid fa-truck-monster text-lg"></i>
            </div>
            <div>
                <h1 class="text-xs md:text-base font-bold tracking-wide text-white leading-tight">Fuerteventura 4x4 & Servicios</h1>
                <p class="text-[10px] text-amber-400/90 font-medium">26 Puntos Totales • 10 Playas 4x4 • 9 Gasolineras • 7 Supers</p>
            </div>
        </div>
        <div class="flex items-center space-x-2">
            <button onclick="fitAllMarkers()" class="px-3 py-1.5 rounded-lg text-xs font-bold bg-amber-500 hover:bg-amber-600 text-gray-950 transition flex items-center gap-1.5 shadow-lg active:scale-95">
                <i class="fa-solid fa-expand"></i> <span class="hidden sm:inline">Ver Todos (26)</span>
            </button>
        </div>
    </header>

    <!-- Map & Drawer Container -->
    <div class="flex-1 relative overflow-hidden flex">

        <!-- Sidebar / Filter Drawer -->
        <aside id="sidebar" class="absolute md:relative inset-y-0 left-0 w-80 md:w-96 bg-gray-900/95 backdrop-blur border-r border-gray-800 p-3 flex flex-col space-y-2.5 z-20 shadow-2xl transition-transform duration-300 transform -translate-x-full md:translate-x-0">
            
            <!-- Live Search Box -->
            <div class="relative">
                <i class="fa-solid fa-magnifying-glass absolute left-3 top-2.5 text-gray-400 text-xs"></i>
                <input type="text" id="search-input" placeholder="Buscar playa, pista, gasolinera o super..." 
                       class="w-full bg-gray-800 border border-gray-700 rounded-lg pl-8 pr-3 py-1.5 text-xs text-gray-100 placeholder-gray-400 focus:outline-none focus:border-amber-500 transition">
            </div>

            <!-- Layer Toggles Grid -->
            <div class="bg-gray-800/60 p-2 rounded-xl border border-gray-700/60">
                <div class="text-[10px] font-bold text-gray-400 uppercase tracking-wider mb-1.5 flex items-center justify-between">
                    <span>Visibilidad de Capas</span>
                    <span id="active-count-badge" class="text-amber-400 font-mono">26 Activos</span>
                </div>
                <div class="grid grid-cols-2 gap-1.5 text-xs">
                    <label class="flex items-center justify-between p-1.5 bg-gray-900/80 rounded-lg border border-gray-700/80 cursor-pointer hover:border-red-500/50 transition">
                        <span class="flex items-center gap-1.5 font-semibold text-[11px] text-red-400">
                            <span class="w-2.5 h-2.5 rounded-full bg-red-500 inline-block shadow"></span>
                            4x4 a Mar (10)
                        </span>
                        <input type="checkbox" id="toggle-4x4" checked class="w-3.5 h-3.5 accent-red-500 cursor-pointer">
                    </label>

                    <label class="flex items-center justify-between p-1.5 bg-gray-900/80 rounded-lg border border-gray-700/80 cursor-pointer hover:border-orange-500/50 transition">
                        <span class="flex items-center gap-1.5 font-semibold text-[11px] text-orange-400">
                            <span class="w-2.5 h-2.5 rounded-full bg-orange-500 inline-block shadow"></span>
                            Pistas Off-Road
                        </span>
                        <input type="checkbox" id="toggle-pistas" checked class="w-3.5 h-3.5 accent-orange-500 cursor-pointer">
                    </label>

                    <label class="flex items-center justify-between p-1.5 bg-gray-900/80 rounded-lg border border-gray-700/80 cursor-pointer hover:border-emerald-500/50 transition">
                        <span class="flex items-center gap-1.5 font-semibold text-[11px] text-emerald-400">
                            <span class="w-2.5 h-2.5 rounded-full bg-emerald-500 inline-block shadow"></span>
                            Gasolineras (9)
                        </span>
                        <input type="checkbox" id="toggle-gas" checked class="w-3.5 h-3.5 accent-emerald-500 cursor-pointer">
                    </label>

                    <label class="flex items-center justify-between p-1.5 bg-gray-900/80 rounded-lg border border-gray-700/80 cursor-pointer hover:border-sky-500/50 transition">
                        <span class="flex items-center gap-1.5 font-semibold text-[11px] text-sky-400">
                            <span class="w-2.5 h-2.5 rounded-full bg-sky-500 inline-block shadow"></span>
                            Supers (7)
                        </span>
                        <input type="checkbox" id="toggle-super" checked class="w-3.5 h-3.5 accent-sky-500 cursor-pointer">
                    </label>
                </div>
            </div>

            <!-- Filter Tabs -->
            <div class="flex gap-1 border-b border-gray-800 pb-1.5 text-[11px]">
                <button id="tab-btn-all" onclick="switchTab('all')" class="flex-1 py-1 px-1 rounded-md font-bold text-center bg-amber-500 text-gray-950 transition">Todos (26)</button>
                <button id="tab-btn-4x4" onclick="switchTab('4x4')" class="flex-1 py-1 px-1 rounded-md font-medium text-gray-400 hover:text-white transition">4x4 (10)</button>
                <button id="tab-btn-gas" onclick="switchTab('gas')" class="flex-1 py-1 px-1 rounded-md font-medium text-gray-400 hover:text-white transition">Gas (9)</button>
                <button id="tab-btn-super" onclick="switchTab('super')" class="flex-1 py-1 px-1 rounded-md font-medium text-gray-400 hover:text-white transition">Supers (7)</button>
            </div>

            <!-- Dynamic Interactive Scrollable List -->
            <div class="flex-1 space-y-1.5 overflow-y-auto custom-scrollbar pr-1" id="location-list-container">
                <!-- Location Items Rendered Dynamically via JS -->
            </div>

            <div class="p-2 bg-amber-500/10 border border-amber-500/30 rounded-lg text-[10px] text-amber-300 flex items-start gap-2 shrink-0">
                <i class="fa-solid fa-triangle-exclamation text-amber-400 text-sm shrink-0 mt-0.5"></i>
                <p><b>Nota de Seguridad:</b> Comprobar pleamar antes de aparcar en orilla. En pistas sin cobertura, guarda este mapa o usa un GPS offline.</p>
            </div>
        </aside>

        <!-- Main Map Viewport -->
        <main class="flex-1 h-full w-full relative">
            <div id="map"></div>
        </main>
    </div>

    <!-- JavaScript Application Logic -->
    <script>
        // 1. ALL 10 COASTAL 4X4 DESTINATIONS (EXACT SEA LEVEL COORDINATES)
        const spots4x4 = [
            {
                id: "4x4-1",
                num: 1,
                category: "4x4",
                name: "1. Playa de Jarugo / Jarubio",
                region: "Costa Oeste",
                coords: [28.5721, -14.0412],
                desc: "<b>Dificultad: Alta.</b> Acceso por la rambla del barranco con zanjas y piedras. Pernocta directa sobre la arena a orilla de mar.",
                gmaps: "https://www.google.com/maps/search/?api=1&query=28.5721,-14.0412"
            },
            {
                id: "4x4-2",
                num: 2,
                category: "4x4",
                name: "2. Caleta de la Peña Victoria / Junco",
                region: "Costa Oeste",
                coords: [28.5583, -14.0531],
                desc: "<b>Dificultad: Alta.</b> Pistas muy erosionadas con tramos de roca volcánica expuesta. Ensenada virgen a ras del agua.",
                gmaps: "https://www.google.com/maps/search/?api=1&query=28.5583,-14.0531"
            },
            {
                id: "4x4-3",
                num: 3,
                category: "4x4",
                name: "3. Playa de Tebeto",
                region: "Costa Oeste",
                coords: [28.5833, -14.0325],
                desc: "<b>Dificultad: Alta.</b> Pista estrecha con roderas profundas que desemboca directamente en una cala salvaje sobre la playa.",
                gmaps: "https://www.google.com/maps/search/?api=1&query=28.5833,-14.0325"
            },
            {
                id: "4x4-4",
                num: 4,
                category: "4x4",
                name: "4. Playa del Valle / Aguas Verdes",
                region: "Costa Oeste",
                coords: [28.4835, -14.0820],
                desc: "<b>Dificultad: Media.</b> Descenso por pista rocosa bordeando los acantilados hasta la playa y piscinas naturales.",
                gmaps: "https://www.google.com/maps/search/?api=1&query=28.4835,-14.0820"
            },
            {
                id: "4x4-5",
                num: 5,
                category: "4x4",
                name: "5. Ensenada de Jacomar",
                region: "Costa Este / Barranco",
                coords: [28.2581, -13.9189],
                desc: "<b>Dificultad: Alta.</b> Descenso técnico por el cauce seco del Barranco de Jacomar. Poblado marinero y playa de arena negra.",
                gmaps: "https://www.google.com/maps/search/?api=1&query=28.2581,-13.9189"
            },
            {
                id: "4x4-6",
                num: 6,
                category: "4x4",
                name: "6. Cala de la Torre",
                region: "Costa Este / Antigua",
                coords: [28.3758, -13.8340],
                desc: "<b>Dificultad: Media/Alta.</b> Ruta de tierra por el cauce del Barranco de la Torre directa a la cala resguardada frente al mar.",
                gmaps: "https://www.google.com/maps/search/?api=1&query=28.3758,-13.8340"
            },
            {
                id: "4x4-7",
                num: 7,
                category: "4x4",
                name: "7. Playa de los Ojos / Puertito",
                region: "Sur / Jandía",
                coords: [28.0838, -14.4926],
                desc: "<b>Dificultad: Media/Alta.</b> Bajada final muy empinada y rota finalizando exactamente en la orilla de la Playa de los Ojos.",
                gmaps: "https://www.google.com/maps/search/?api=1&query=28.0838,-14.4926"
            },
            {
                id: "4x4-8",
                num: 8,
                category: "4x4",
                name: "8. Caleta de la Madera y Yeso",
                region: "Jandía / Barlovento",
                coords: [28.1025, -14.2850],
                desc: "<b>Dificultad: Muy Alta / Reductora.</b> Pistas extremas sobre lava volcánica afilada en la costa indómita. Sin cobertura.",
                gmaps: "https://www.google.com/maps/search/?api=1&query=28.1025,-14.2850"
            },
            {
                id: "4x4-9",
                num: 9,
                category: "4x4",
                name: "9. Cofete (Playa / Cementerio)",
                region: "Sur / Jandía",
                coords: [28.1128, -14.3782],
                desc: "<b>Dificultad: Media.</b> Pista de tierra que desemboca al borde de la orilla de Cofete junto al emblemático cementerio sobre la arena.",
                gmaps: "https://www.google.com/maps/search/?api=1&query=28.1128,-14.3782"
            },
            {
                id: "4x4-10",
                num: 10,
                category: "4x4",
                name: "10. Costa Norte (Majanicho a Cotillo)",
                region: "Norte",
                coords: [28.7360, -13.9350],
                desc: "<b>Dificultad: Fácil/Media.</b> Ruta costera de calas y playas de ola con pistas onduladas de tierra y lapilli.",
                gmaps: "https://www.google.com/maps/search/?api=1&query=28.7360,-13.9350"
            }
        ];

        // 2. ALL 9 GAS STATIONS
        const gasStations = [
            { id: "gas-1", category: "gas", name: "DISA Corralejo", region: "Norte", coords: [28.7285, -13.8682], gmaps: "https://www.google.com/maps/search/?api=1&query=28.7285,-13.8682" },
            { id: "gas-2", category: "gas", name: "Repsol Puerto del Rosario", region: "Centro", coords: [28.5021, -13.8634], gmaps: "https://www.google.com/maps/search/?api=1&query=28.5021,-13.8634" },
            { id: "gas-3", category: "gas", name: "Moeve / Cepsa Aeropuerto", region: "Centro", coords: [28.4523, -13.8651], gmaps: "https://www.google.com/maps/search/?api=1&query=28.4523,-13.8651" },
            { id: "gas-4", category: "gas", name: "DISA El Matorral", region: "Centro", coords: [28.4602, -13.8643], gmaps: "https://www.google.com/maps/search/?api=1&query=28.4602,-13.8643" },
            { id: "gas-5", category: "gas", name: "DISA Caleta de Fuste", region: "Centro", coords: [28.3951, -13.8602], gmaps: "https://www.google.com/maps/search/?api=1&query=28.3951,-13.8602" },
            { id: "gas-6", category: "gas", name: "Estación Tuineje / El Caracol", region: "Interior", coords: [28.3284, -14.0491], gmaps: "https://www.google.com/maps/search/?api=1&query=28.3284,-14.0491" },
            { id: "gas-7", category: "gas", name: "DISA Gran Tarajal", region: "Sur", coords: [28.2153, -14.0252], gmaps: "https://www.google.com/maps/search/?api=1&query=28.2153,-14.0252" },
            { id: "gas-8", category: "gas", name: "DISA Tarajalejo", region: "Sur", coords: [28.1921, -14.1203], gmaps: "https://www.google.com/maps/search/?api=1&query=28.1921,-14.1203" },
            { id: "gas-9", category: "gas", name: "Shell / DISA Morro Jable", region: "Sur", coords: [28.0532, -14.3481], gmaps: "https://www.google.com/maps/search/?api=1&query=28.0532,-14.3481" }
        ];

        // 3. ALL 7 SUPERMARKETS
        const supermarkets = [
            { id: "sup-1", category: "super", name: "Mercadona & Lidl Corralejo", region: "Norte", coords: [28.7251, -13.8712], gmaps: "https://www.google.com/maps/search/?api=1&query=28.7251,-13.8712" },
            { id: "sup-2", category: "super", name: "Mercadona & Lidl Puerto del Rosario", region: "Centro", coords: [28.5025, -13.8681], gmaps: "https://www.google.com/maps/search/?api=1&query=28.5025,-13.8681" },
            { id: "sup-3", category: "super", name: "Mercadona El Matorral", region: "Centro", coords: [28.4605, -13.8641], gmaps: "https://www.google.com/maps/search/?api=1&query=28.4605,-13.8641" },
            { id: "sup-4", category: "super", name: "Mercadona & HiperDino Caleta Fuste", region: "Centro", coords: [28.3904, -13.8653], gmaps: "https://www.google.com/maps/search/?api=1&query=28.3904,-13.8653" },
            { id: "sup-5", category: "super", name: "Padilla Spar El Cotillo", region: "Norte", coords: [28.6832, -14.0115], gmaps: "https://www.google.com/maps/search/?api=1&query=28.6832,-14.0115" },
            { id: "sup-6", category: "super", name: "Eurospar Gran Tarajal", region: "Sur", coords: [28.2124, -14.0201], gmaps: "https://www.google.com/maps/search/?api=1&query=28.2124,-14.0201" },
            { id: "sup-7", category: "super", name: "Mercadona Morro Jable (Esquinzo)", region: "Sur", coords: [28.0552, -14.3353], gmaps: "https://www.google.com/maps/search/?api=1&query=28.0552,-14.3353" }
        ];

        // 4. OFF-ROAD TRACKS (POLYLINES)
        const pistasDificiles = [
            [[28.558, -14.015], [28.563, -14.026], [28.5721, -14.0412]],
            [[28.543, -14.042], [28.552, -14.048], [28.5583, -14.0531]],
            [[28.570, -14.020], [28.580, -14.028], [28.5833, -14.0325]],
            [[28.470, -14.050], [28.478, -14.070], [28.4835, -14.0820]],
            [[28.285, -13.955], [28.272, -13.938], [28.2581, -13.9189]],
            [[28.388, -13.862], [28.380, -13.845], [28.3758, -13.8340]],
            [[28.080, -14.220], [28.095, -14.250], [28.1025, -14.2850]],
            [[28.053, -14.348], [28.075, -14.420], [28.089, -14.482], [28.0838, -14.4926]],
            [[28.053, -14.348], [28.082, -14.360], [28.100, -14.370], [28.1128, -14.3782]],
            [[28.730, -13.870], [28.736, -13.935], [28.687, -14.010]]
        ];

        // COMBINED MASTER ARRAY
        const allLocations = [...spots4x4, ...gasStations, ...supermarkets];

        // INITIALIZE LEAFLET MAP
        const map = L.map('map', {
            center: [28.38, -14.05],
            zoom: 10,
            zoomControl: true
        });

        // TILE LAYERS
        const satLayer = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
            maxZoom: 18,
            attribution: '© Esri World Imagery'
        }).addTo(map);

        const osmLayer = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '© OpenStreetMap contributors'
        });

        L.control.layers({
            "Vista Satélite (Recomendada)": satLayer,
            "Mapa Callejero (OSM)": osmLayer
        }, null, { position: 'topright' }).addTo(map);

        // LAYER GROUPS
        const group4x4 = L.layerGroup().addTo(map);
        const groupPistas = L.layerGroup().addTo(map);
        const groupGas = L.layerGroup().addTo(map);
        const groupSuper = L.layerGroup().addTo(map);

        // SVG MARKER GENERATORS
        function create4x4SvgIcon(num) {
            const svgHtml = `
                <div class="marker-pin-svg">
                    <svg width="36" height="36" viewBox="0 0 36 36">
                        <circle cx="18" cy="18" r="16" fill="#dc2626" stroke="#f59e0b" stroke-width="2.5"/>
                        <text x="18" y="23" font-size="15" font-weight="900" text-anchor="middle" fill="#ffffff" font-family="sans-serif">${num}</text>
                    </svg>
                </div>`;
            return L.divIcon({
                html: svgHtml,
                className: '',
                iconSize: [36, 36],
                iconAnchor: [18, 18],
                popupAnchor: [0, -18]
            });
        }

        function createServiceSvgIcon(color, svgPath) {
            const svgHtml = `
                <div class="marker-pin-svg">
                    <svg width="30" height="30" viewBox="0 0 32 32">
                        <circle cx="16" cy="16" r="14" fill="${color}" stroke="#ffffff" stroke-width="2"/>
                        <g fill="#ffffff" transform="translate(6,6) scale(0.83)">${svgPath}</g>
                    </svg>
                </div>`;
            return L.divIcon({
                html: svgHtml,
                className: '',
                iconSize: [30, 30],
                iconAnchor: [15, 15],
                popupAnchor: [0, -15]
            });
        }

        const gasSvgPath = `<path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-7 14H7v-2h5v2zm0-4H7V7h5v6zm6 4h-2V7h2v10z"/>`;
        const superSvgPath = `<path d="M7 18c-1.1 0-1.99.9-1.99 2S5.9 22 7 22s2-.9 2-2-.9-2-2-2zM1 2v2h2l3.6 7.59-1.35 2.45c-.16.28-.25.61-.25.96 0 1.1.9 2 2 2h12v-2H7.42c-.14 0-.25-.11-.25-.25l.03-.12.9-1.63h7.45c.75 0 1.41-.41 1.75-1.03l3.58-6.49c.08-.14.12-.31.12-.48 0-.55-.45-1-1-1H5.21l-.94-2H1zm16 16c-1.1 0-1.99.9-1.99 2s.89 2 1.99 2 2-.9 2-2-.9-2-2-2z"/>`;

        const iconGas = createServiceSvgIcon('#10b981', gasSvgPath);
        const iconSuper = createServiceSvgIcon('#0284c7', superSvgPath);

        const markerMap = new Map();

        // ADD 4X4 MARKERS
        spots4x4.forEach((spot) => {
            const marker = L.marker(spot.coords, { icon: create4x4SvgIcon(spot.num) })
                .bindPopup(`
                    <div class="text-gray-100 p-1 min-w-[220px]">
                        <div class="flex items-center gap-1.5 mb-1">
                            <span class="w-3 h-3 rounded-full bg-red-500 inline-block shadow"></span>
                            <h3 class="font-bold text-xs text-amber-400 leading-snug">${spot.name}</h3>
                        </div>
                        <p class="text-[11px] text-gray-300 mb-2 leading-relaxed">${spot.desc}</p>
                        <div class="text-[9px] font-mono text-gray-400 mb-2">GPS: ${spot.coords[0].toFixed(4)}, ${spot.coords[1].toFixed(4)}</div>
                        <a href="${spot.gmaps}" target="_blank" class="flex items-center justify-center gap-1.5 w-full bg-amber-500 hover:bg-amber-600 text-gray-950 font-bold text-xs py-1.5 px-2 rounded-lg shadow transition active:scale-95">
                            <i class="fa-solid fa-location-arrow"></i> Navegar en Google Maps
                        </a>
                    </div>
                `, { className: 'custom-popup' })
                .addTo(group4x4);
            
            markerMap.set(spot.id, { marker, data: spot });
        });

        // ADD GAS STATION MARKERS
        gasStations.forEach((gas) => {
            const marker = L.marker(gas.coords, { icon: iconGas })
                .bindPopup(`
                    <div class="p-1 min-w-[180px]">
                        <div class="font-bold text-xs text-emerald-400 mb-1 flex items-center gap-1.5">
                            <i class="fa-solid fa-gas-pump"></i> ${gas.name}
                        </div>
                        <p class="text-[10px] text-gray-300 mb-2">Zona: ${gas.region}</p>
                        <a href="${gas.gmaps}" target="_blank" class="flex items-center justify-center gap-1.5 w-full bg-emerald-500 hover:bg-emerald-600 text-gray-950 font-bold text-xs py-1 px-2 rounded-lg shadow transition">
                            <i class="fa-solid fa-location-arrow"></i> Abrir Google Maps
                        </a>
                    </div>
                `, { className: 'custom-popup' })
                .addTo(groupGas);

            markerMap.set(gas.id, { marker, data: gas });
        });

        // ADD SUPERMARKET MARKERS
        supermarkets.forEach((sup) => {
            const marker = L.marker(sup.coords, { icon: iconSuper })
                .bindPopup(`
                    <div class="p-1 min-w-[180px]">
                        <div class="font-bold text-xs text-sky-400 mb-1 flex items-center gap-1.5">
                            <i class="fa-solid fa-cart-shopping"></i> ${sup.name}
                        </div>
                        <p class="text-[10px] text-gray-300 mb-2">Zona: ${sup.region}</p>
                        <a href="${sup.gmaps}" target="_blank" class="flex items-center justify-center gap-1.5 w-full bg-sky-500 hover:bg-sky-600 text-gray-950 font-bold text-xs py-1 px-2 rounded-lg shadow transition">
                            <i class="fa-solid fa-location-arrow"></i> Abrir Google Maps
                        </a>
                    </div>
                `, { className: 'custom-popup' })
                .addTo(groupSuper);

            markerMap.set(sup.id, { marker, data: sup });
        });

        // DRAW OFF-ROAD TRACKS
        pistasDificiles.forEach(path => {
            L.polyline(path, { color: '#f97316', weight: 3.5, dashArray: '6, 7', opacity: 0.9 }).addTo(groupPistas);
        });

        // RENDER SIDEBAR LIST ITEMS
        let activeTab = 'all';

        function renderLocationList(query = '') {
            const container = document.getElementById('location-list-container');
            container.innerHTML = '';

            const filtered = allLocations.filter(loc => {
                const matchesTab = (activeTab === 'all') || (loc.category === activeTab);
                const matchesSearch = loc.name.toLowerCase().includes(query.toLowerCase()) || 
                                      loc.region.toLowerCase().includes(query.toLowerCase());
                return matchesTab && matchesSearch;
            });

            if (filtered.length === 0) {
                container.innerHTML = `<div class="text-center py-6 text-xs text-gray-500">No se encontraron resultados</div>`;
                return;
            }

            filtered.forEach(loc => {
                const card = document.createElement('div');
                let borderHover = "hover:border-amber-500";
                let badgeBg = "bg-gray-800 text-gray-300";

                if (loc.category === '4x4') {
                    borderHover = "hover:border-red-500";
                    badgeBg = "bg-red-950/80 text-red-300 border border-red-800/50";
                } else if (loc.category === 'gas') {
                    borderHover = "hover:border-emerald-500";
                    badgeBg = "bg-emerald-950/80 text-emerald-300 border border-emerald-800/50";
                } else if (loc.category === 'super') {
                    borderHover = "hover:border-sky-500";
                    badgeBg = "bg-sky-950/80 text-sky-300 border border-sky-800/50";
                }

                card.className = `p-2 bg-gray-800/80 hover:bg-gray-800 rounded-lg border border-gray-700/70 ${borderHover} cursor-pointer transition shadow-sm location-item`;
                
                card.innerHTML = `
                    <div class="flex justify-between items-start mb-0.5">
                        <span class="font-bold text-xs text-gray-100">${loc.name}</span>
                        <span class="text-[9px] ${badgeBg} px-1.5 py-0.5 rounded font-mono shrink-0 ml-1.5">${loc.region}</span>
                    </div>
                    ${loc.desc ? `<p class="text-gray-400 text-[10px] leading-tight line-clamp-2">${loc.desc.replace(/<b>.*?<\/b>/g, '')}</p>` : ''}
                `;

                card.addEventListener('click', () => {
                    const item = markerMap.get(loc.id);
                    if (item) {
                        focusSpot(item.marker, loc.coords);
                    }
                });

                container.appendChild(card);
            });
        }

        // TAB SWITCHING LOGIC
        function switchTab(tab) {
            activeTab = tab;
            const tabs = ['all', '4x4', 'gas', 'super'];
            
            tabs.forEach(t => {
                const btn = document.getElementById(`tab-btn-${t}`);
                if (t === tab) {
                    btn.className = 'flex-1 py-1 px-1 rounded-md font-bold text-center bg-amber-500 text-gray-950 transition';
                } else {
                    btn.className = 'flex-1 py-1 px-1 rounded-md font-medium text-gray-400 hover:text-white transition';
                }
            });

            const searchVal = document.getElementById('search-input').value;
            renderLocationList(searchVal);
        }

        // LAYER TOGGLES
        document.getElementById('toggle-4x4').addEventListener('change', (e) => e.target.checked ? map.addLayer(group4x4) : map.removeLayer(group4x4));
        document.getElementById('toggle-pistas').addEventListener('change', (e) => e.target.checked ? map.addLayer(groupPistas) : map.removeLayer(groupPistas));
        document.getElementById('toggle-gas').addEventListener('change', (e) => e.target.checked ? map.addLayer(groupGas) : map.removeLayer(groupGas));
        document.getElementById('toggle-super').addEventListener('change', (e) => e.target.checked ? map.addLayer(groupSuper) : map.removeLayer(groupSuper));

        // FOCUS MAP ON SELECTED MARKER
        function focusSpot(marker, coords) {
            map.flyTo(coords, 14, { duration: 1.2 });
            setTimeout(() => marker.openPopup(), 1250);
            
            // Auto close mobile drawer when tapping an item
            if (window.innerWidth < 768) {
                const sidebar = document.getElementById('sidebar');
                sidebar.classList.add('-translate-x-full');
            }
        }

        // FIT ALL 26 MARKERS IN VIEWPORT
        function fitAllMarkers() {
            const allCoords = allLocations.map(s => s.coords);
            if (allCoords.length > 0) {
                map.fitBounds(allCoords, { padding: [50, 50] });
            }
        }

        // TOGGLE SIDEBAR DRAWER
        function toggleSidebar() {
            const sidebar = document.getElementById('sidebar');
            sidebar.classList.toggle('-translate-x-full');
            setTimeout(() => map.invalidateSize(), 300);
        }

        // LIVE SEARCH INPUT LISTENER
        document.getElementById('search-input').addEventListener('input', (e) => {
            renderLocationList(e.target.value);
        });

        // INITIAL LOAD & RESIZE RECALIBRATIONS
        window.addEventListener('load', () => {
            renderLocationList();
            setTimeout(() => {
                map.invalidateSize();
                fitAllMarkers();
            }, 300);
            setTimeout(() => {
                map.invalidateSize();
            }, 1000);
        });

        window.addEventListener('resize', () => {
            map.invalidateSize();
        });
    </script>
</body>
</html>
